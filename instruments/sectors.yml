# The eleven Select Sector SPDRs.
#
# This file is the milestone's evidence, not just its data. Nine of these listed
# together in December 1998; XLRE was carved out of financials in October 2015
# and XLC out of technology and discretionary in June 2018. A backtest of
# `sectors` starting in 2010 must therefore hold **nine** members, not eleven —
# and that is only true because membership carries its own validity window in
# universes.yml rather than being applied at read time (PROJECT.md §5.3).
#
# Get that wrong and every cross-sectional result before 2015 is contaminated by
# two funds that did not exist, in the two sectors that were reorganised. It is
# the most expensive kind of lookahead because it looks like nothing at all.

instruments:
  - symbol: XLB
    name: Materials Select Sector SPDR Fund
    asset_class: equity
    sub_class: materials
    exchange: ARCA
    currency: USD
    calendar: XNYS
    inception: 1998-12-16
    backfill_start: 1999-01-04
    delisted: null
    sources:
      stooq: xlb.us
    return_basis: price
    distribution_yield_hint: 0.018
    costs: { commission_bps: 2, spread_bps: 2 }
    min_adv_usd: 10_000_000
    # PRIIPs blocks the whole family for EU retail and no single-sector UCITS
    # line tracks these indices closely enough to substitute. Research-only,
    # stated rather than left to be discovered at the broker.
    ucits_equivalent: null
    enabled: true
    tags: [sector]

