# Broad equity beta, US-listed.
#
# Adding an instrument is an edit to this file and nothing else. See
# docs/ADDING_AN_INSTRUMENT.md.
#
# None of these is purchasable from an EU retail account: under PRIIPs a
# US-domiciled ETF publishes no KID, so the broker refuses the order however
# liquid the fund is. `ucits_equivalent` names what to buy instead, and
# `tradeable_eu` on those lines is what the live universe filters on
# (PROJECT.md §5.7).

instruments:
  - symbol: SPY
    name: SPDR S&P 500 ETF Trust
    asset_class: equity
    sub_class: us_large_cap
    exchange: ARCA
    currency: USD
    calendar: XNYS
    inception: 1993-01-22
    backfill_start: 1993-02-01
    delisted: null
    sources:
      stooq: spy.us
      twelvedata: SPY
    return_basis: price
    distribution_yield_hint: 0.013    # documentation only; flags price-return drag
    costs: { commission_bps: 2, spread_bps: 1 }
    min_adv_usd: 50_000_000
    ucits_equivalent: CSPX.UK
    enabled: true
    tags: [core, benchmark]

