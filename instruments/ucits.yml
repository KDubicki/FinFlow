# The lines an EU retail account can actually buy.
#
# Under PRIIPs a US-domiciled ETF publishes no KID, so a Polish brokerage
# account cannot buy SPY, GLD, TLT or any of the SPDR sectors however liquid
# they are. Without this file the system computes target portfolios that cannot
# be executed — which is not a rounding error in the research, it is the
# difference between a system and a simulation (PROJECT.md §5.7).
#
# Every line here is `ucits: true`, which is what `tradeable_eu` filters on. The
# US lines point at these through `ucits_equivalent`, and the registry refuses a
# mapping to a fund it does not ingest: telling someone to buy CSPX.UK while
# holding no price history for it is advice nobody can check.
#
# **Two honest caveats, both measurable rather than hand-waved.**
#
# 1. *The `.uk` vendor symbols are unverified against Stooq.* If a symbol is
#    wrong, ingestion raises `SymbolNotFound` for that instrument and only that
#    instrument — the failure domain is the instrument (PROJECT.md §4.4) — and
#    it appears in the digest by name. That is the intended way to find out,
#    and it beats shipping the entries disabled where nobody would look.
# 2. *These are not the same funds.* They track the same indices with different
#    domiciles, currencies, share classes and, critically, **much shorter
#    histories and thinner volume**. `scripts/verify_ucits_mapping.py` measures
#    return correlation, tracking difference and history length against the US
#    original, and `docs/RESULTS.md` reports what it found. A mapping that has
#    not been measured is a guess wearing a ticker.

instruments:
  - symbol: CSPX.UK
    name: iShares Core S&P 500 UCITS ETF (Acc)
    asset_class: equity
    sub_class: us_large_cap
    exchange: XLON
    currency: USD
    calendar: XLON
    inception: 2010-05-19
    backfill_start: 2010-06-01
    delisted: null
    sources:
      stooq: cspx.uk
    return_basis: price
    # Accumulating: distributions are reinvested inside the fund, so the price
    # series *is* total return. The one place in this registry where the
    # price-return bias of §6.4 genuinely does not apply — and a reason the
    # tracking difference against SPY will look like a drift rather than noise.
    distribution_yield_hint: 0.0
    costs: { commission_bps: 2, spread_bps: 3 }
    min_adv_usd: 1_000_000
    ucits: true
    enabled: true
    tags: [tradeable_eu, accumulating]

