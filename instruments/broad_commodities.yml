  - symbol: UUP
    name: Invesco DB US Dollar Index Bullish Fund
    asset_class: currency
    sub_class: usd_index
    exchange: ARCA
    currency: USD
    calendar: XNYS
    inception: 2007-02-20
    backfill_start: 2007-03-01
    delisted: null
