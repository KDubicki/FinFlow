    return_basis: price
    distribution_yield_hint: 0.0
    costs: { commission_bps: 2, spread_bps: 8 }
    min_adv_usd: 2_000_000
    ucits_equivalent: null
    enabled: true
    tags: [roll_yield, thin]

  - symbol: DBA
    name: Invesco DB Agriculture Fund
    asset_class: commodity
    sub_class: agriculture
    exchange: ARCA
    currency: USD
    calendar: XNYS
    inception: 2007-01-05
    backfill_start: 2007-02-01
    delisted: null
