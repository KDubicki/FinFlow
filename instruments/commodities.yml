  - symbol: GDX
    name: VanEck Gold Miners ETF
    asset_class: equity
    sub_class: gold_miners
    exchange: ARCA
    currency: USD
    calendar: XNYS
    inception: 2006-05-16
    backfill_start: 2006-06-01
    delisted: null
    sources:
      stooq: gdx.us
      twelvedata: GDX
    return_basis: price
    distribution_yield_hint: 0.015
    costs: { commission_bps: 2, spread_bps: 4 }
    min_adv_usd: 25_000_000
    # A VanEck Gold Miners UCITS ETF exists, but its Stooq symbol is unverified.
    # Left null rather than guessed: an unverified mapping is worse than an
    # absent one, because the digest would tell you to buy something nobody has
    # checked exists.
    ucits_equivalent: null
    enabled: true
    tags: [equity_proxy]

  - symbol: GDXJ
