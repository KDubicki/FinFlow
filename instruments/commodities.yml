# Precious metals: the metal itself and the miners.
#
# Physically backed metal trusts distribute nothing, so price return is total
# return here and PROJECT.md §6.4's bias does not apply to the metal lines. The
# miners do distribute, modestly, and carry the usual price-return drag.
#
# The spreads widen sharply down the list. GLD trades at a basis point; GDXJ and
# SIL do not, and a flat assumption across the file would understate their round
# trip by five to ten times and manufacture alpha (PROJECT.md §5.7). That is why
# every line states its own floor rather than inheriting the asset-class default.

instruments:
  - symbol: GLD
    name: SPDR Gold Shares
    asset_class: commodity
    sub_class: precious_metals
    exchange: ARCA
    currency: USD
    calendar: XNYS
    inception: 2004-11-18
    backfill_start: 2004-12-01
    delisted: null
    sources:
      stooq: gld.us
      twelvedata: GLD
    return_basis: price
    distribution_yield_hint: 0.0
    costs: { commission_bps: 2, spread_bps: 2 }
    min_adv_usd: 50_000_000
    ucits_equivalent: IGLN.UK
    enabled: true
    tags: [core, benchmark]

  - symbol: IAU
    name: iShares Gold Trust
    asset_class: commodity
    sub_class: precious_metals
    exchange: ARCA
    currency: USD
    calendar: XNYS
    inception: 2005-01-21
    backfill_start: 2005-02-01
    delisted: null
    sources:
      stooq: iau.us
      twelvedata: IAU
    return_basis: price
    distribution_yield_hint: 0.0
    costs: { commission_bps: 2, spread_bps: 2 }
    min_adv_usd: 10_000_000
    ucits_equivalent: IGLN.UK
    enabled: true
    tags: []

  - symbol: SGOL
    name: abrdn Physical Gold Shares ETF
    asset_class: commodity
    sub_class: precious_metals
    exchange: ARCA
    currency: USD
    calendar: XNYS
    inception: 2009-09-09
    backfill_start: 2009-10-01
    delisted: null
    sources:
      stooq: sgol.us
    return_basis: price
    distribution_yield_hint: 0.0
    costs: { commission_bps: 2, spread_bps: 3 }
    min_adv_usd: 2_000_000
    ucits_equivalent: IGLN.UK
    enabled: true
    # Three gold trusts in one universe is deliberate: they track the same metal
    # through different structures, which is what makes them a check on each
    # other's data quality rather than three bets.
    tags: [gold_proxy]

  - symbol: SLV
    name: iShares Silver Trust
