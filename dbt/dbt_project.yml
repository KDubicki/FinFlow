name: finflow
version: "1.0.0"
config-version: 2
profile: finflow

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Overridden by the pipeline so a run is pinned to what it actually read.
  snapshot_id: "unpinned"
  registry_commit: "unknown"

  # Cross-source divergence thresholds, in basis points, per asset class
  # (PROJECT.md §6.6). Two quotes on SPY differing by 25 bps is a defect; two
  # quotes on UNG differing by 25 bps is a Tuesday. One global number would
  # either drown the equity signal or never fire on the commodities.
  divergence_bps_equity: 25
  divergence_bps_rates: 25
  divergence_bps_currency: 25
  divergence_bps_credit: 50
  divergence_bps_commodity: 75

models:
  finflow:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
