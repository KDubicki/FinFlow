# Grouped weekly so updates arrive as one pull request rather than forty.
# Cheap to set up, and it stops the dependency graph rotting quietly between
# bursts of work (PROJECT.md §11.7).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
