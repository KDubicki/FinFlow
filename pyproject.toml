[project]
name = "finflow"
version = "0.1.0"
description = "Multi-asset ETF data platform: ingestion, modeling, backtesting and alerting"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "exchange-calendars>=4.5",
    "polars>=1.17",
    "httpx>=0.28",
    "patito>=0.8",
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
    "pyarrow>=18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "respx>=0.22",
]

[project.scripts]
finflow-backfill = "finflow.entrypoints.cli.backfill:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finflow"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # unused arguments
    "SIM",  # flake8-simplify
    "PTH",  # use pathlib
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]  # fixtures are often unused-looking arguments

[tool.ruff.lint.isort]
known-first-party = ["finflow"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
pretty = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# Neither ships type information.
[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "patito.*"]
ignore_missing_imports = true

# Patito's Model resolves to Any without stubs, which makes every schema a
# subclass of Any. The schemas are still checked at runtime by Patito itself.
[[tool.mypy.overrides]]
module = ["finflow.contracts.frames"]
disallow_subclassing_any = false

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: requires external services (deselect with '-m \"not integration\"')",
    "slow: long-running test",
]

[tool.coverage.run]
source = ["src/finflow"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
